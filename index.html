<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Moved to the meal builder</title>
<meta name="description" content="This page has moved to the live meal builder, which builds a week of Portuguese meals inside a budget from the Auchan Castelo Branco catalogue.">
<meta name="robots" content="noindex">
<link rel="canonical" href="https://mealapp-98c1.onrender.com/">
<meta http-equiv="refresh" content="0; url=https://mealapp-98c1.onrender.com/">
<script>location.replace('https://mealapp-98c1.onrender.com/');</script>
<style>
  :root{
    --paper:#FBF6EE; --card:#FFFFFF; --line:#EADFCF; --ink:#1C1613; --ink-2:#584B40; --ink-3:#6F6051;
    --accent:#B4441C; --accent-2:#8E3313;
    --ui:ui-sans-serif,system-ui,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root{ --paper:#16120E; --card:#221C16; --line:#342B21; --ink:#F7F0E7; --ink-2:#CEBCA8; --ink-3:#AE9C88;
      --accent:#E88A55; --accent-2:#F2A377; }
  }
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--paper);color:var(--ink);
    font:16px/1.6 var(--ui);-webkit-font-smoothing:antialiased;padding:24px}
  main{max-width:520px;width:100%;background:var(--card);border:1px solid var(--line);border-radius:20px;
    padding:40px;box-shadow:0 4px 14px rgba(70,45,20,.08), 0 14px 36px rgba(70,45,20,.08)}
  .mark{width:40px;height:40px;border-radius:12px;margin-bottom:24px}
  h1{margin:0 0 12px;font-size:1.5rem;font-weight:700;letter-spacing:-.02em}
  p{margin:0 0 24px;color:var(--ink-2);font-size:.9375rem}
  a.go{display:inline-flex;align-items:center;gap:8px;background:var(--accent);color:#fff;text-decoration:none;
    font-weight:600;font-size:.9375rem;padding:14px 22px;border-radius:10px}
  a.go:hover{background:var(--accent-2)}
  a.go:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
  .alt{margin:24px 0 0;padding-top:20px;border-top:1px solid var(--line);font-size:.875rem;color:var(--ink-3)}
  .alt a{color:var(--accent)}
</style>
</head>
<body>
<main>
  <svg class="mark" viewBox="0 0 34 34" aria-hidden="true">
    <rect width="34" height="34" rx="10" fill="#B4441C"/>
    <path d="M10 13h14l-1.4 11H11.4z" fill="none" stroke="#FFF3EA" stroke-width="2" stroke-linejoin="round"/>
    <path d="M13.2 13a3.8 3.8 0 0 1 7.6 0" fill="none" stroke="#FFF3EA" stroke-width="2"/>
  </svg>
  <h1>This moved to the meal builder</h1>
  <p>The live app builds a week of Portuguese meals inside a budget, using the real Auchan Castelo Branco prices. Taking you there now.</p>
  <a class="go" href="https://mealapp-98c1.onrender.com/">Open the meal builder</a>
  <p class="alt">The earlier four-day and seven-day plans are still here: <a href="plan.html">the week plan with per-meal prices</a>.</p>
</main>
</body>
</html>
